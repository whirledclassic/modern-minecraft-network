name: modern-mc

services:
  bootstrap:
    image: busybox:1.37
    container_name: modern-mc-bootstrap
    volumes:
      - ./plugin/config-lobby.yml:/payload/config-lobby.yml:ro
      - ./plugin/config-survival.yml:/payload/config-survival.yml:ro
      - ./plugins/lobby:/out/lobby
      - ./plugins/survival:/out/survival
      - ./config/geyser.yml:/payload/geyser.yml:ro
      - ./config/floodgate.yml:/payload/floodgate.yml:ro
      - ./plugins/proxy:/out/proxy
    command: >
      sh -c "mkdir -p /out/lobby/ModernNetwork /out/survival/ModernNetwork
      /out/proxy/Geyser-Velocity /out/proxy/floodgate
      && cp /payload/config-lobby.yml /out/lobby/ModernNetwork/config.yml
      && cp /payload/config-survival.yml /out/survival/ModernNetwork/config.yml
      && cp /payload/geyser.yml /out/proxy/Geyser-Velocity/config.yml
      && cp /payload/floodgate.yml /out/proxy/floodgate/config.yml
      && echo bootstrap-ok"
    restart: "no"
    networks:
      - mcnet

  proxy:
    image: itzg/mc-proxy
    container_name: modern-mc-proxy
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      lobby:
        condition: service_healthy
      survival:
        condition: service_healthy
    environment:
      TYPE: VELOCITY
      VELOCITY_VERSION: latest
      MEMORY: ${PROXY_MEMORY:-512M}
      REPLACE_ENV_VARIABLES: "true"
      ENV_VARIABLE_PREFIX: "CFG_"
      CFG_MOTD: "${MOTD:-&b&lModern Network &8| &fJava + Bedrock}"
      CFG_MAX_PLAYERS: "${MAX_PLAYERS:-60}"
    ports:
      - "25565:25565"
      - "19132:19132/udp"
    volumes:
      - ./proxy/velocity.toml:/config/velocity.toml:ro
      - ./proxy/forwarding.secret:/config/forwarding.secret
      - ./plugins/proxy:/plugins
      - proxy-data:/server
    networks:
      - mcnet
    restart: unless-stopped

  lobby:
    image: itzg/minecraft-server
    container_name: modern-mc-lobby
    tty: true
    stdin_open: true
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: ${MC_VERSION:-LATEST}
      ONLINE_MODE: "FALSE"
      MEMORY: ${LOBBY_MEMORY:-2G}
      USE_AIKAR_FLAGS: "TRUE"
      MODE: adventure
      FORCE_GAMEMODE: "TRUE"
      DIFFICULTY: peaceful
      PVP: "FALSE"
      ALLOW_NETHER: "FALSE"
      ENABLE_COMMAND_BLOCK: "FALSE"
      SPAWN_PROTECTION: "48"
      MOTD: "Lobby"
      MAX_PLAYERS: ${MAX_PLAYERS:-60}
      VIEW_DISTANCE: "8"
      SIMULATION_DISTANCE: "4"
      LEVEL: world
      LEVEL_TYPE: FLAT
      GENERATE_STRUCTURES: "FALSE"
      SPAWN_ANIMALS: "FALSE"
      SPAWN_MONSTERS: "FALSE"
      SPAWN_NPCS: "FALSE"
      ENABLE_RCON: "TRUE"
      RCON_PASSWORD: ${RCON_PASSWORD:-change-me}
      RCON_CMDS_STARTUP: |-
        gamerule doDaylightCycle false
        gamerule doWeatherCycle false
        lp creategroup vip
        lp creategroup elite
        lp creategroup champion
        lp group default permission set velocity.command.server true
      REPLACE_ENV_VARIABLES: "TRUE"
      ENV_VARIABLE_PREFIX: "CFG_"
      CFG_VELOCITY_SECRET: "${VELOCITY_SECRET:-change-me-to-a-long-random-string}"
      MODRINTH_PROJECTS: |
        luckperms
        vault
        placeholderapi
        viaversion
        tab
      EXISTING_OPS_FILE: MERGE
      STOP_SERVER_ANNOUNCE_DELAY: 5
    volumes:
      - lobby-data:/data
      - ./config/paper-global.yml:/config/paper-global.yml:ro
      - ./plugins/lobby:/plugins
      - ./datapacks/lobby:/data/world/datapacks/modern-hub
    networks:
      - mcnet
    restart: unless-stopped
    healthcheck:
      test: mc-health
      start_period: 3m
      interval: 15s
      retries: 20

  survival:
    image: itzg/minecraft-server
    container_name: modern-mc-survival
    tty: true
    stdin_open: true
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: ${MC_VERSION:-LATEST}
      ONLINE_MODE: "FALSE"
      MEMORY: ${SURVIVAL_MEMORY:-4G}
      USE_AIKAR_FLAGS: "TRUE"
      MODE: survival
      DIFFICULTY: ${SURVIVAL_DIFFICULTY:-normal}
      PVP: "TRUE"
      ALLOW_NETHER: "TRUE"
      ENABLE_COMMAND_BLOCK: "FALSE"
      SPAWN_PROTECTION: "16"
      MOTD: "Survival"
      MAX_PLAYERS: ${MAX_PLAYERS:-60}
      VIEW_DISTANCE: "10"
      SIMULATION_DISTANCE: "8"
      LEVEL: world
      SEED: ${SURVIVAL_SEED:-}
      ENABLE_RCON: "TRUE"
      RCON_PASSWORD: ${RCON_PASSWORD:-change-me}
      RCON_CMDS_STARTUP: |-
        lp creategroup vip
        lp creategroup elite
        lp creategroup champion
        lp group vip parent set default
        lp group elite parent set vip
        lp group champion parent set elite
        lp group default permission set essentials.spawn true
        lp group default permission set essentials.tpa true
        lp group default permission set essentials.home true
        lp group default permission set essentials.sethome true
        lp group default permission set velocity.command.server true
      REPLACE_ENV_VARIABLES: "TRUE"
      ENV_VARIABLE_PREFIX: "CFG_"
      CFG_VELOCITY_SECRET: "${VELOCITY_SECRET:-change-me-to-a-long-random-string}"
      MODRINTH_PROJECTS: |
        luckperms
        essentialsx
        vault
        worldguard
        coreprotect
        griefprevention
        placeholderapi
        viaversion
        spark
      EXISTING_OPS_FILE: MERGE
      STOP_SERVER_ANNOUNCE_DELAY: 10
    volumes:
      - survival-data:/data
      - ./config/paper-global.yml:/config/paper-global.yml:ro
      - ./plugins/survival:/plugins
      - ./datapacks/survival:/data/world/datapacks/modern-spawn
    networks:
      - mcnet
    restart: unless-stopped
    healthcheck:
      test: mc-health
      start_period: 4m
      interval: 15s
      retries: 20

  platform:
    build: ./platform
    image: modern-mc-platform:local
    container_name: modern-mc-platform
    depends_on:
      - lobby
      - survival
    environment:
      RCON_PASSWORD: ${RCON_PASSWORD:-change-me}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      STORE_SECRET: ${STORE_SECRET:-change-me-store}
      DEMO_PAYMENTS: ${DEMO_PAYMENTS:-true}
      SERVER_NAME: ${SERVER_NAME:-Modern Network}
      JOIN_HOST: ${JOIN_HOST:-localhost}
      STORE_CURRENCY: ${STORE_CURRENCY:-USD}
      LOBBY_RCON_HOST: lobby
      SURVIVAL_RCON_HOST: survival
      DATA_DIR: /data
    ports:
      - "${PLATFORM_PORT:-8080}:8080"
    volumes:
      - platform-data:/data
    networks:
      - mcnet
    restart: unless-stopped

volumes:
  proxy-data:
  lobby-data:
  survival-data:
  platform-data:

networks:
  mcnet:
    driver: bridge
